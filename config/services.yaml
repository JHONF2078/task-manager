# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  app.mail.from_address: '%env(resolve:MAIL_FROM_ADDRESS)%'
  app.mail.from_name: 'Soporte MiApp'
  app.report.output_dir: '%kernel.project_dir%/var/reports'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $reportOutputDir: '%app.report.output_dir%'
            string $defaultFromAddress: '%app.mail.from_address%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Controller/DebugController.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
        autowire: true
        autoconfigure: true
        public: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\ResetPasswordMailService:
        arguments:
            $fromAddress: '%app.mail.from_address%'
            $fromName: '%app.mail.from_name%'

    # === AutoMapper Configuration ===
    AutoMapperPlus\Configuration\AutoMapperConfigInterface:
        class: AutoMapperPlus\Configuration\AutoMapperConfig
        factory: ['@App\Mapper\Auto\AutoMapperConfigFactory', 'create']
        configurator: ['@App\Mapper\Auto\AutoMapperConfigFactory', 'configure']

    AutoMapperPlus\AutoMapperInterface:
        class: AutoMapperPlus\AutoMapper
        arguments:
            - '@AutoMapperPlus\Configuration\AutoMapperConfigInterface'

    App\Helper\MapperHelper:
        autowire: true
        autoconfigure: true
        public: true

    # ===================================================================
    # MANEJADORES DE EXCEPCIONES DE API (Elegir uno)
    # ===================================================================

    # --- Opción 1: Manejador moderno con formato "Problem Details" (RFC 9457) ---
    # Este manejador centraliza todos los errores de la API en un solo lugar.
    # ESTÁ ACTIVADO POR DEFECTO.
    #App\EventSubscriber\ProblemDetailsApiExceptionSubscriber:
    #    tags: [ 'kernel.event_subscriber' ]


    # --- Opción 2: Manejador "Legacy" (simple) ---
    # Este sistema utiliza dos suscriptores separados.
    # Para activarlo:
    #   1. Comenta las líneas de 'ProblemDetailsApiExceptionSubscriber' (arriba).
    #   2. Descomenta las siguientes líneas.

    App\EventSubscriber\ApiExceptionSubscriber:
        tags: [ 'kernel.event_subscriber' ]
